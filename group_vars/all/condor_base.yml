---
# HTCondor configuration is shared with usegalaxy-eu/infrastructure-playbook,
# vendored as a git submodule and read directly from there:
#   - infrastructure-playbook/group_vars/htcondor/vars.yml       (loaded in pre_tasks)
#   - infrastructure-playbook/templates/htcondor/condor_config.local.j2  (post_tasks)
# Only the VGCN-specific deltas are maintained in this file; they are applied
# via set_fact, which outranks include_vars, so these deterministically win.
htcondor_vgcn_overrides:
  # Every VGCN node is an execute node.
  htcondor_role_execute: true
  # Upstream also allows the BI RNA server CIDR (132.230.153.0/28); VGCN stays narrower.
  htcondor_allow_write: "10.4.68.0/24"
  # Upstream uses a dynamic per-host IP here, which would not allow the fixed
  # VGCN submit/receiver host.
  htcondor_allow_negotiator: "132.230.223.239,$(CONDOR_HOST),$(ALLOW_WRITE)"
