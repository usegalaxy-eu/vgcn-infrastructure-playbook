---
# HTCondor configuration is shared with usegalaxy-eu/infrastructure-playbook and
# downloaded from there at run time (see the pre_tasks in vgcn-playbook.yml):
#   - templates/htcondor/condor_config.local.j2  -> /etc/condor/condor_config.local
#   - group_vars/htcondor/vars.yml               -> loaded via include_vars
# Only the VGCN-specific deltas are maintained in this file.
htcondor_config_local_template_url: "https://raw.githubusercontent.com/usegalaxy-eu/infrastructure-playbook/master/templates/htcondor/condor_config.local.j2"
htcondor_group_vars_url: "https://raw.githubusercontent.com/usegalaxy-eu/infrastructure-playbook/master/group_vars/htcondor/vars.yml"

# VGCN-specific deltas applied on top of the upstream vars.
# Applied via set_fact, which outranks include_vars, so these deterministically win.
htcondor_vgcn_overrides:
  # Every VGCN node is an execute node.
  htcondor_role_execute: true
  # Upstream also allows the BI RNA server CIDR (132.230.153.0/28); VGCN stays narrower.
  htcondor_allow_write: "10.4.68.0/24"
  # Upstream uses a dynamic per-host IP here, which would not allow the fixed
  # VGCN submit/receiver host.
  htcondor_allow_negotiator: "132.230.223.239,$(CONDOR_HOST),$(ALLOW_WRITE)"
